name: Cleanup Merged Branch

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged head branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const protectedBranches = ['main', 'master', 'develop'];
            if (protectedBranches.includes(branchName)) {
              console.log(`Skipping protected branch: ${branchName}`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`,
              });
              console.log(`Successfully deleted merged branch: ${branchName}`);
            } catch (error) {
              console.log(`Branch may have already been deleted: ${error.message}`);
            }

