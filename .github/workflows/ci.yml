name: CI Validation (Linters, Builds & Test Coverage)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-frontend:
    name: Frontend (Lint, Build & Coverage) — apps/web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Run ESLint
        run: npm --prefix apps/web run lint

      - name: Validate Next.js production build
        run: npm --prefix apps/web run build

      - name: Run tests with >= 90% coverage threshold
        run: npm --prefix apps/web run test:cov

  validate-backend:
    name: Backend (Lint, Build & Coverage) — apps/api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/api

      - name: Run Oxlint
        run: npm --prefix apps/api run lint

      - name: Validate NestJS production build
        run: npm --prefix apps/api run build

      - name: Run tests with >= 90% coverage threshold
        run: npm --prefix apps/api run test:cov

  validate-engine:
    name: AI Engine (Lint & Coverage) — apps/engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/engine/requirements.txt

      - name: Run Ruff linter and formatter check
        run: |
          cd apps/engine
          ruff check .
          ruff format --check .

      - name: Run tests with >= 90% coverage threshold
        run: |
          cd apps/engine
          pytest --cov=. --cov-report=term-missing --cov-fail-under=90
