name: CI & Test Coverage Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend Tests & Coverage (apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Run tests with >= 90% coverage threshold
        run: npm --prefix apps/web run test:cov

  test-backend:
    name: Backend Tests & Coverage (apps/api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/api

      - name: Run tests with >= 90% coverage threshold
        run: npm --prefix apps/api run test:cov

  test-engine:
    name: AI Engine Tests & Coverage (apps/engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/engine/requirements.txt

      - name: Run tests with >= 90% coverage threshold
        run: |
          cd apps/engine
          pytest --cov=. --cov-report=term-missing --cov-fail-under=90

