[project]
name = "adapt-edu-engine"
version = "1.1.0"
description = "AdaptEdu AI & Reasoning Engine (FastAPI + LangChain)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 90
