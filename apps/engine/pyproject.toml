[project]
name = "adapt-edu-engine"
version = "1.1.0"
description = "AdaptEdu AI & Reasoning Engine (FastAPI + LangChain)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "venv",
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends pattern)
    "E402", # module level import not at top of file
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SIM"]
